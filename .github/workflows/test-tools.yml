name: Lint and test tools
on:
  push:
    branches: [master]
    paths: [tools/**]
  pull_request:
    paths: [tools/**]
jobs:
  lint-and-test-tools:
    name: Lint and test tool scripts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Shellcheck
        run: mise shellcheck
      - name: Run tool tests
        run: mise test:tools
